<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a7b5a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="url(#emeraldGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#a4e494" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Monogram C A in white & mint -->
  <text x="32" y="43" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CA</text>
  <!-- Dot signature -->
  <circle cx="50" cy="41" r="3.5" fill="#a4e494"/>
</svg>
